spring.application.name=Astore
spring.datasource.url=jdbc:postgresql://localhost:5432/astore
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.file.name=logs/astore.log

logging.logback.rollingpolicy.file-name-pattern=logs/archive/astore-%d{yyyy-MM-dd}.%i.log.gz

logging.logback.rollingpolicy.max-file-size=10KB

logging.logback.rollingpolicy.max-history=30

logging.logback.rollingpolicy.total-size-cap=100MB
server.port=8080