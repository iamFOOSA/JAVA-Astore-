name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn -B test

      - name: Build backend package
        run: mvn -B package -DskipTests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: astore-backend:${{ github.sha }}

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: astore-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        run: |
          BACKEND_DEPLOY_HOOK_URL='${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}'
          FRONTEND_DEPLOY_HOOK_URL='${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}'

          if [ -z "$BACKEND_DEPLOY_HOOK_URL" ] || [ -z "$FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "GitHub secrets RENDER_BACKEND_DEPLOY_HOOK_URL and RENDER_FRONTEND_DEPLOY_HOOK_URL must be configured."
            exit 1
          fi

          curl -fsS -X POST "$BACKEND_DEPLOY_HOOK_URL"
          curl -fsS -X POST "$FRONTEND_DEPLOY_HOOK_URL"

  healthcheck:
    name: Production healthcheck
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Wait for deployed app
        run: |
          BACKEND_HEALTH_URL='${{ secrets.BACKEND_HEALTH_URL }}'
          FRONTEND_HEALTH_URL='${{ secrets.FRONTEND_HEALTH_URL }}'

          if [ -z "$BACKEND_HEALTH_URL" ] || [ -z "$FRONTEND_HEALTH_URL" ]; then
            echo "GitHub secrets BACKEND_HEALTH_URL and FRONTEND_HEALTH_URL must be configured."
            exit 1
          fi

          check_url() {
            local name="$1"
            local url="$2"
            local expected="$3"

            for attempt in {1..60}; do
              if curl -fsS "$url" | grep -q "$expected"; then
                echo "$name healthcheck passed on attempt $attempt."
                return 0
              fi

              echo "Waiting for $name health, attempt $attempt/60..."
              sleep 15
            done

            echo "$name healthcheck failed."
            curl -i "$url" || true
            return 1
          }

          check_url "backend" "$BACKEND_HEALTH_URL" '"status":"UP"'
          check_url "frontend" "$FRONTEND_HEALTH_URL" 'OK'
