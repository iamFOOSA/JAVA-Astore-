name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  MAVEN_CLI_OPTS: "-B"
  BACKEND_IMAGE_NAME: "astore-backend"
  FRONTEND_IMAGE_NAME: "astore-frontend"
  SONAR_HOST_URL: "https://sonarcloud.io"
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'iamFOOSA_JAVA-Astore-' }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'iamfoosa' }}
  SONAR_QUALITY_GATE_WAIT: ${{ vars.SONAR_QUALITY_GATE_WAIT || 'false' }}
  SONAR_QUALITY_GATE_TIMEOUT: "300"
  HEALTHCHECK_ATTEMPTS: "60"
  HEALTHCHECK_INTERVAL_SECONDS: "15"

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run backend build and tests
        run: mvn ${MAVEN_CLI_OPTS} verify

      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "GitHub secret SONAR_TOKEN must be configured."
            exit 1
          fi

          if [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "GitHub variables SONAR_PROJECT_KEY and SONAR_ORGANIZATION must be configured."
            exit 1
          fi

          mvn ${MAVEN_CLI_OPTS} org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait="${SONAR_QUALITY_GATE_WAIT}" \
            -Dsonar.qualitygate.timeout="${SONAR_QUALITY_GATE_TIMEOUT}"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build backend Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          tags: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Build frontend Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./frontend
          push: false
          tags: ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

  deploy-frontend:
    name: Deploy Frontend to Render
    runs-on: ubuntu-latest
    permissions: {}
    needs: docker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Trigger Render frontend deploy
        env:
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "GitHub secret RENDER_FRONTEND_DEPLOY_HOOK_URL must be configured."
            exit 1
          fi

          curl -fsS -X POST "$FRONTEND_DEPLOY_HOOK_URL"

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    permissions: {}
    needs: docker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Trigger Render backend deploy
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$BACKEND_DEPLOY_HOOK_URL" ]; then
            echo "GitHub secret RENDER_BACKEND_DEPLOY_HOOK_URL must be configured."
            exit 1
          fi

          curl -fsS -X POST "$BACKEND_DEPLOY_HOOK_URL"

  frontend-healthcheck:
    name: Frontend Healthcheck
    runs-on: ubuntu-latest
    permissions: {}
    needs: deploy-frontend
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 15

    steps:
      - name: Wait for frontend
        env:
          FRONTEND_HEALTH_URL: ${{ secrets.FRONTEND_HEALTH_URL }}
        run: |
          if [ -z "$FRONTEND_HEALTH_URL" ]; then
            echo "GitHub secret FRONTEND_HEALTH_URL must be configured."
            exit 1
          fi

          for attempt in $(seq 1 "$HEALTHCHECK_ATTEMPTS"); do
            if curl -fsS "$FRONTEND_HEALTH_URL" | grep -q 'OK'; then
              echo "Frontend healthcheck passed on attempt $attempt."
              exit 0
            fi

            echo "Waiting for frontend health, attempt $attempt/$HEALTHCHECK_ATTEMPTS..."
            sleep "$HEALTHCHECK_INTERVAL_SECONDS"
          done

          echo "Frontend healthcheck failed."
          curl -i "$FRONTEND_HEALTH_URL" || true
          exit 1

  backend-healthcheck:
    name: Backend Healthcheck
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - deploy-backend
      - frontend-healthcheck
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 15

    steps:
      - name: Wait for backend
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            echo "GitHub secret BACKEND_HEALTH_URL must be configured."
            exit 1
          fi

          for attempt in $(seq 1 "$HEALTHCHECK_ATTEMPTS"); do
            if curl -fsS "$BACKEND_HEALTH_URL" | grep -q '"status":"UP"'; then
              echo "Backend healthcheck passed on attempt $attempt."
              exit 0
            fi

            echo "Waiting for backend health, attempt $attempt/$HEALTHCHECK_ATTEMPTS..."
            sleep "$HEALTHCHECK_INTERVAL_SECONDS"
          done

          echo "Backend healthcheck failed."
          curl -i "$BACKEND_HEALTH_URL" || true
          exit 1
